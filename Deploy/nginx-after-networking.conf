# systemd drop-in for nginx: /etc/systemd/system/nginx.service.d/after-networking.conf
#
# Measured on this container, not theorised: nginx.service reached its
# `nginx -t` at 18:49:51 and ifupdown's networking.service finished
# configuring eth0 at 18:49:52, one second later. The site binds the LAN
# address explicitly (`listen 10.0.0.55:80`, so the server is not reachable
# from anywhere the address is not), and binding an address that does not
# exist yet is a hard failure:
#
#   nginx: [emerg] bind() to 10.0.0.55:80 failed (99: Cannot assign requested address)
#
# nginx ships `After=network-online.target`, which is inert here: no
# wait-online unit is enabled under ifupdown, so the target is reached
# immediately. Ordering after networking.service is the ordering that
# actually means "eth0 has its address".
#
# Restart=on-failure is the second line of defence, for a boot where
# something else delays the address past networking.service.

[Unit]
After=networking.service
Wants=networking.service

[Service]
Restart=on-failure
RestartSec=3
