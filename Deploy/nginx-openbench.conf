# nginx in front of gunicorn. Required once DEBUG=False: Django no longer
# serves /static/ itself, so nginx serves the collectstatic output from
# STATIC_ROOT and proxies everything else to gunicorn on the loopback.
#
#   install: cp Deploy/nginx-openbench.conf /etc/nginx/sites-available/openbench
#            ln -s ../sites-available/openbench /etc/nginx/sites-enabled/openbench
#            rm -f /etc/nginx/sites-enabled/default
#            nginx -t && systemctl reload nginx
#
# Bound to the container's LAN address only. PGN uploads from workers are
# small .pgn.bz2 files; 64m is generous.

server {
    listen 10.0.0.55:80;
    server_name 10.0.0.55 openbench;

    client_max_body_size 64m;

    location /static/ {
        alias /opt/openbench/OpenBench/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
